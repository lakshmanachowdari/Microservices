name: Quiz Service CI

on:
  push:
    paths:
      - 'quiz-service/**'
  pull_request:
    paths:
      - 'quiz-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: quiz-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Maven Project
        run: mvn clean install

      - name: Verify JAR
        run: ls -la target/

      - name: Build & Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: lakshmanachowdari/online-assessment-platform-jenkins
          tags: quiz-service
          registry: docker.io
          directory: ./quiz-service
          dockerfile: ./quiz-service/Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}