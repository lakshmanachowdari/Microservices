name: Quiz Service CI

on:
  push:
    paths:
      - 'quiz-service/**'
  pull_request:
    paths:
      - 'quiz-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: quiz-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build Project
        run: mvn clean install

      - name: Run Tests
        run: mvn test