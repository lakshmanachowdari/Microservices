# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/manage/prometheus'
    static_configs:
      - targets: ['localhost:8083']
    
  - job_name: 'question-service'
    metrics_path: '/manage/prometheus'
    static_configs:
      - targets: ['localhost:8081', 'localhost:8085']
    
  - job_name: 'quiz-service'
    metrics_path: '/manage/prometheus'
    static_configs:
      - targets: ['localhost:8082', 'localhost:8084']
    
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'